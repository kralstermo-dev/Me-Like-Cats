<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me Like Cats - Why</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 24px;
            letter-spacing: 1px;
            color: #ffffff;
            font-weight: bold;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 24px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .content-box {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            text-align: left;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 16px;
            font-weight: 300;
        }

        p:last-child {
            margin-bottom: 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            font-size: 0.95rem;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Me Like Cats</h1>
        <h2>Why This Was Made</h2>
        
        <div class="content-box">
            <p>Sometimes the world moves a little too fast, and we just need a quiet place to step back, catch our breath, and disconnect.<br>And That's Okay!</p>
            
            <p>Enjoy The Peace And Ofcourse The Cats!</p>
            
            <p>Its Build From The <a href="https://cataas.com" target="_blank">Cataas</a> API, Plus volume Alpha From C418 As Music</p>
        </div>

        <a href="index.html" class="back-btn">← Back to Cats</a>
    </div>

</body>
</html>
