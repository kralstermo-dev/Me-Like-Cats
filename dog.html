<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me Like Dogs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        .dog-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
        }

        .dog-image.active {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.2), rgba(0,0,0,0.5));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        h1 {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 300;
            text-align: center;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            letter-spacing: 1px;
            animation: fadeInDown 1.5s ease;
        }

        .hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin-top: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            animation: pulse 2s infinite;
        }

        .controls-container {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="main-wrapper">
        <img id="dog-layer-1" src="https://placedog.net/1080/1920?random" class="dog-image active" alt="Random Dog">
        <img id="dog-layer-2" class="dog-image" alt="Random Dog">

        <div id="intro-overlay" class="overlay">
            <h1>Just Relax and enjoy some dogs</h1>
            <div class="hint">Click anywhere to begin your relaxation</div>
        </div>

        <div class="controls-container">
            <button id="mute-btn" class="btn" onclick="toggleMute(event)">Mute</button>
            <a href="index.html" class="btn" onclick="handleSwitchClick(event)">Switch to Cats</a>
        </div>
    </div>

    <audio id="bg-music"></audio>

    <script>
        const wrapper = document.getElementById('main-wrapper');
        const overlay = document.getElementById('intro-overlay');
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');
        
        const layers = [
            document.getElementById('dog-layer-1'),
            document.getElementById('dog-layer-2')
        ];
        
        let currentLayerIndex = 0;
        let slideshowTimer = null;
        let isFirstClick = true;

        const playlist = [
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Aria%20Math%20%28Minecraft%20Volume%20Beta%29%20%5BatgjKEgSqSU%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Blocks%20%28Minecraft%20Volume%20Beta%29%20%5BJQw8MEqhMRA%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Chirp%20%28Minecraft%20Volume%20Beta%29%20%5BcCibTj6drhM%5D.mp3",
            "https://ia902804.us.archive.org/12/items/c418-volume-beta/C418%20-%20Dead%20Voxel%20%28Minecraft%20Volume%20Beta%29%20%5BwGQDJNksrAM%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Alpha%20%28Minecraft%20Volume%20Beta%29%20%5BxLfm2nnCOpc%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Eleven%20%28Minecraft%20Volume%20Beta%29%20%5Beh4rVC1Mv0E%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Far%20%28Minecraft%20Volume%20Beta%29%20%5BUqKcX87h3c0%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Mall%20%28Minecraft%20Volume%20Beta%29%20%5BxmBfruermmo%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Mellohi%20%28Minecraft%20Volume%20Beta%29%20%5BTrYlTm06o-8%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Stal%20%28Minecraft%20Volume%20Beta%29%20%5B0E5l2GHBxB8%5D.mp3",
            "https://dn720002.ca.archive.org/0/items/c418-volume-beta/C418%20-%20Wait%20%28Minecraft%20Volume%20Beta%29%20%5BsBl9qcaQos4%5D.mp3"
        ];

        function playRandomTrack() {
            const randomIndex = Math.floor(Math.random() * playlist.length);
            music.src = playlist[randomIndex];
            music.volume = 0.35;
            music.play().catch(err => console.log("Playback track shift event:", err));
        }

        music.addEventListener('ended', () => {
            playRandomTrack();
        });

        function toggleMute(event) {
            event.stopPropagation();
            if (music.muted) {
                music.muted = false;
                muteBtn.textContent = "Mute";
                muteBtn.style.backgroundColor = "rgba(0, 0, 0, 0.5)";
            } else {
                music.muted = true;
                muteBtn.textContent = "Unmute";
                muteBtn.style.backgroundColor = "rgba(224, 86, 86, 0.4)";
            }
        }

        function handleSwitchClick(event) {
            event.stopPropagation();
        }

        function fetchNextDog() {
            const nextLayerIndex = (currentLayerIndex + 1) % 2;
            const activeLayer = layers[currentLayerIndex];
            const nextLayer = layers[nextLayerIndex];

            nextLayer.src = "https://placedog.net/1080/1920?random=" + Date.now();
            
            nextLayer.onload = () => {
                nextLayer.classList.add('active');
                activeLayer.classList.remove('active');
                currentLayerIndex = nextLayerIndex;
            };
        }

        function resetSlideshowInterval() {
            clearInterval(slideshowTimer);
            slideshowTimer = setInterval(fetchNextDog, 7000);
        }

        wrapper.addEventListener('click', () => {
            if (isFirstClick) {
                overlay.classList.add('hidden');
                playRandomTrack();
                fetchNextDog();
                resetSlideshowInterval();
                isFirstClick = false;
            } else {
                fetchNextDog();
                resetSlideshowInterval();
            }
        });
    </script>
</body>
</html>
